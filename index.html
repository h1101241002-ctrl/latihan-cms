<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Boyan Craft — Admin CMS</title>
<style>
:root{--ink:#432719;--brown:#603b27;--brown2:#80563c;--cream:#fbf7f0;--paper:#fffdf9;--sand:#eee1d3;--muted:#8b7769;--line:#eadfd3;--sage:#879477;--red:#b84c42;--shadow:0 12px 35px #4c2c1710}
*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font:14px/1.5 Inter,system-ui,Arial,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0}.hidden{display:none!important}
.login-wrap{min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 15% 15%,#ead9c8,transparent 30%),var(--cream)}
.login-card{width:min(430px,100%);background:var(--paper);border:1px solid var(--line);border-radius:24px;padding:36px;box-shadow:var(--shadow)}
.brand{font-family:Georgia,serif;letter-spacing:2px;font-size:21px;font-weight:bold}.brand small{display:block;font:11px system-ui;letter-spacing:4px;color:var(--muted);margin-top:3px}
.brand-mark{width:42px;height:42px;border:2px solid var(--brown);transform:rotate(45deg);display:grid;place-items:center;margin-right:14px;border-radius:8px}.brand-mark span{transform:rotate(-45deg);font-size:20px}
.brand-row{display:flex;align-items:center;margin-bottom:34px}.muted{color:var(--muted)}h1,h2,h3,p{margin-top:0}h1{font:34px Georgia,serif;margin-bottom:6px}h2{font:25px Georgia,serif;margin-bottom:6px}h3{font-size:15px;margin-bottom:12px}
.field{display:grid;gap:6px;margin:15px 0}.field label{font-weight:650;font-size:12px;color:var(--brown)}input,select,textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:11px 12px;background:#fff;color:var(--ink);outline:none}input:focus,select:focus,textarea:focus{border-color:var(--brown2);box-shadow:0 0 0 3px #80563c18}textarea{min-height:90px;resize:vertical}
.btn{background:var(--brown);color:white;border-radius:10px;padding:10px 15px;font-weight:650}.btn:hover{background:#4c2d1d}.btn.light{background:#f1e7dc;color:var(--brown)}.btn.outline{background:transparent;border:1px solid var(--line);color:var(--brown)}.btn.danger{background:#fae9e6;color:var(--red)}.btn.small{padding:7px 10px;font-size:12px}.btn.block{width:100%;padding:12px}.login-error{color:var(--red);font-size:12px;min-height:18px}
.layout{display:flex;min-height:100vh}.sidebar{width:245px;background:#f2e7db;border-right:1px solid var(--line);padding:24px 15px;position:fixed;inset:0 auto 0 0;overflow:auto;z-index:5}.side-brand{display:flex;align-items:center;padding:4px 12px 28px}.side-brand .brand{font-size:17px}.nav-label{font-size:10px;text-transform:uppercase;letter-spacing:1.5px;color:#9a8575;padding:12px 12px 7px}.nav button{display:flex;align-items:center;gap:12px;width:100%;padding:11px 13px;border-radius:10px;background:transparent;color:var(--ink);text-align:left;margin:3px 0}.nav button.active,.nav button:hover{background:#e5d2bf}.nav .ico{width:20px;text-align:center;font-size:16px}.nav-sep{height:1px;background:#ddcaba;margin:14px 8px}
.main{margin-left:245px;width:calc(100% - 245px)}.topbar{height:66px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:flex-end;padding:0 32px;background:#fffaf5;position:sticky;top:0;z-index:4}.admin{display:flex;align-items:center;gap:10px;font-weight:650}.avatar{width:34px;height:34px;border-radius:50%;background:var(--brown);color:#fff;display:grid;place-items:center}
.content{padding:30px 34px;max-width:1500px;margin:auto}.crumb{font-size:12px;color:var(--muted);margin-bottom:13px}.page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:18px;margin-bottom:24px}.page-head p{color:var(--muted);margin:0}.grid{display:grid;gap:16px}.stats{grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:22px}.stat,.panel,.card{background:var(--paper);border:1px solid var(--line);border-radius:15px;box-shadow:var(--shadow)}.stat{padding:19px}.stat .label{font-size:12px;color:var(--muted)}.stat strong{font:28px Georgia,serif;display:block;margin-top:7px}.panel{padding:20px;margin-bottom:18px}.panel-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:15px}.toolbar{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.toolbar input{max-width:270px}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:650px}th,td{text-align:left;padding:12px 10px;border-bottom:1px solid var(--line);vertical-align:middle}th{font-size:11px;text-transform:uppercase;letter-spacing:.7px;color:var(--muted);background:#fbf5ee}td{font-size:13px}.actions{display:flex;gap:6px}.thumb{width:55px;height:48px;object-fit:cover;border-radius:8px;background:var(--sand)}.pill{display:inline-block;border-radius:99px;background:#edf0e8;color:#59664e;padding:4px 9px;font-size:11px}.empty{padding:35px;text-align:center;color:var(--muted)}
.upload{border:1.5px dashed #cdb39d;border-radius:14px;padding:28px;text-align:center;background:#fdf9f4}.upload input{max-width:280px;margin:12px auto 0;border:0}.gallery{grid-template-columns:repeat(auto-fill,minmax(170px,1fr))}.photo-card{overflow:hidden;border:1px solid var(--line);border-radius:13px;background:#fff}.photo-card img{width:100%;height:190px;object-fit:cover;display:block;background:var(--sand)}.photo-actions{padding:10px;display:flex;justify-content:space-between;align-items:center}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 15px}.span2{grid-column:1/-1}.modal-back{position:fixed;inset:0;background:#21150f75;display:grid;place-items:center;padding:20px;z-index:20}.modal{background:var(--paper);border-radius:17px;padding:23px;width:min(620px,100%);max-height:90vh;overflow:auto;box-shadow:0 20px 70px #0003}.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}.close{background:#f2e7db;border-radius:50%;width:32px;height:32px;color:var(--brown)}.modal-foot{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}.notice{padding:12px 14px;border-radius:10px;background:#f3ecdf;color:#6d503b;font-size:12px;margin:14px 0}.toast{position:fixed;right:24px;bottom:24px;background:#3f2b20;color:#fff;padding:12px 17px;border-radius:10px;z-index:50;box-shadow:var(--shadow)}.calc-result{background:#f2e9df;padding:15px;border-radius:12px;margin-top:10px}.calc-result strong{font:25px Georgia,serif}
@media(max-width:900px){.sidebar{width:210px}.main{margin-left:210px;width:calc(100% - 210px)}.stats{grid-template-columns:repeat(2,1fr)}.content{padding:22px}}
@media(max-width:650px){.sidebar{position:static;width:100%;height:auto;padding:10px}.layout{display:block}.side-brand{padding:8px}.nav{display:flex;overflow:auto}.nav-label,.nav-sep{display:none}.nav button{white-space:nowrap;width:auto}.main{margin:0;width:100%}.topbar{height:52px}.content{padding:18px}.stats{grid-template-columns:repeat(2,1fr)}.page-head{display:block}.page-head .btn{margin-top:15px}.form-grid{grid-template-columns:1fr}.span2{grid-column:auto}}
</style></head><body>
<div id="login" class="login-wrap"><div class="login-card">
 <div class="brand-row"><div class="brand-mark"><span>✥</span></div><div class="brand">BOYAN CRAFT<small>ADMINISTRATION</small></div></div>
 <h2>Selamat datang</h2><p class="muted">Masuk untuk mengelola website Boyan Craft.</p>
 <form id="loginForm"><div class="field"><label>USERNAME</label><input id="username" autocomplete="username" placeholder="Masukkan username" required></div><div class="field"><label>PASSWORD</label><input id="password" type="password" autocomplete="current-password" placeholder="Masukkan password" required></div><div id="loginError" class="login-error"></div><button class="btn block">Masuk ke CMS</button></form>
 <div class="notice">Akun demo: <b>admin</b> / <b>BoyanCraft123!</b><br>Prototype ini menyimpan data di browser perangkat ini.</div>
 </div></div>
<div id="app" class="layout hidden">
<aside class="sidebar"><div class="side-brand"><div class="brand-mark"><span>✥</span></div><div class="brand">BOYAN CRAFT<small>ADMIN CMS</small></div></div>
<div class="nav-label">Menu utama</div><nav class="nav" id="nav">
<button data-page="dashboard" class="active"><span class="ico">⌂</span>Dashboard</button>
<button data-page="products"><span class="ico">▣</span>Kelola Produk</button><button data-page="prices"><span class="ico">◆</span>Harga Jual</button><button data-page="hpp"><span class="ico">▤</span>Kalkulator HPP</button>
<div class="nav-sep"></div><div class="nav-label">Konten website</div>
<button data-page="testimonials"><span class="ico">▧</span>Testimoni</button><button data-page="events"><span class="ico">▦</span>Event</button><button data-page="experience"><span class="ico">☆</span>Experience</button><button data-page="findus"><span class="ico">⌖</span>Find Us</button><button data-page="about"><span class="ico">▤</span>About Us</button><button data-page="faq"><span class="ico">?</span>FAQ</button>
<div class="nav-sep"></div><button data-page="master"><span class="ico">⚙</span>Data Master</button><button id="logout"><span class="ico">⇥</span>Logout</button>
</nav></aside>
<main class="main"><header class="topbar"><div class="admin"><div class="avatar">A</div><span>Admin Boyan Craft</span></div></header><div class="content" id="view"></div></main>
</div>
<div id="modalRoot"></div><div id="toastRoot"></div>
<script>
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const storeKey='boyanCraftCmsV1';
const seed={
 products:[{id:1,name:'Totebag Insang',category:'Totebag',material:'Kanvas',size:'35 × 40 cm',motif:'Corak Insang',price:85000,desc:'Totebag handmade dengan motif khas.'},{id:2,name:'Slingbag Dayak',category:'Slingbag',material:'Kanvas',size:'25 × 20 cm',motif:'Dayak',price:95000,desc:'Tas selempang motif etnik.'}],
 testimonials:[],events:[],experience:[],findus:[{id:1,type:'Fisik',name:'Boyan House',address:'Pontianak',url:''},{id:2,type:'Online',name:'Shopee Boyan Craft',address:'',url:'https://shopee.co.id/'}],
 faq:[{id:1,q:'Bagaimana cara memesan produk?',a:'Pilih produk lalu hubungi Boyan Craft melalui WhatsApp atau marketplace.'},{id:2,q:'Apakah bisa custom desain?',a:'Bisa, silakan hubungi admin untuk konsultasi kebutuhan.'}],
 about:{title:'Tentang Boyan Craft',description:'Boyan Craft merupakan usaha kerajinan handmade yang menghadirkan produk tas dan souvenir dengan sentuhan motif khas.',story:'Boyan Craft berdiri sejak 2019.',problem:'Kebutuhan tas dan souvenir yang unik dan sesuai kebutuhan.',solution:'Produk handmade yang dapat disesuaikan dengan kebutuhan pelanggan.'},
 master:{categories:['Totebag','Slingbag','Dompet','Souvenir','Rajut'],materials:['Kanvas','Katun','Rajut'],sizes:['Kecil','Sedang','Besar'],motifs:['Corak Insang','Dayak','Polos']},
 prices:[]
};
let db=load(),page='dashboard',editing=null;
function load(){try{return {...structuredClone(seed),...JSON.parse(localStorage.getItem(storeKey)||'{}')}}catch{return structuredClone(seed)}}
function save(){localStorage.setItem(storeKey,JSON.stringify(db))}
function esc(v=''){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function toast(t){$('#toastRoot').innerHTML=`<div class="toast">${esc(t)}</div>`;setTimeout(()=>$('#toastRoot').innerHTML='',2600)}
function id(){return Date.now()+Math.floor(Math.random()*1000)}
function imgSrc(file){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(file)})}
$('#loginForm').addEventListener('submit',e=>{e.preventDefault();if($('#username').value==='admin'&&$('#password').value==='BoyanCraft123!'){$('#login').classList.add('hidden');$('#app').classList.remove('hidden');render()}else $('#loginError').textContent='Username atau password tidak sesuai.'});
$('#logout').onclick=()=>confirmAction('Logout','Apakah kamu yakin ingin keluar dari CMS?',()=>{ $('#app').classList.add('hidden');$('#login').classList.remove('hidden');$('#password').value='';page='dashboard';});
$('#nav').addEventListener('click',e=>{const b=e.target.closest('[data-page]');if(!b)return;page=b.dataset.page;$$('#nav button').forEach(x=>x.classList.toggle('active',x===b));render()});
function head(title,desc,action=''){return `<div class="crumb">Dashboard　›　${esc(title)}</div><div class="page-head"><div><h1>${esc(title)}</h1><p>${esc(desc)}</p></div>${action}</div>`}
function stat(label,value){return `<div class="stat"><div class="label">${label}</div><strong>${value}</strong></div>`}
function render(){const v=$('#view');({dashboard:dashboard,products:products,testimonials:testimonials,events:()=>generic('events','Event','Kelola kegiatan dan acara Boyan Craft',['Nama Event','Tanggal','Lokasi','Deskripsi']),experience:()=>generic('experience','Experience','Kelola pengalaman dan aktivitas Boyan Craft',['Nama Kegiatan','Deskripsi']),findus:()=>findus(),faq:()=>faq(),about:()=>about(),master:()=>master(),prices:()=>prices(),hpp:()=>hpp() }[page]||dashboard)()}
function dashboard(){let total=Object.values(db).filter(Array.isArray).reduce((a,x)=>a+x.length,0);$('#view').innerHTML=head('Dashboard','Ringkasan pengelolaan website Boyan Craft')+`<div class="grid stats">${stat('Total Produk',db.products.length)}${stat('Foto Testimoni',db.testimonials.length)}${stat('Event',db.events.length)}${stat('FAQ',db.faq.length)}</div><div class="panel"><h3>Selamat datang di CMS Boyan Craft</h3><p class="muted">Gunakan menu di sebelah kiri untuk mengelola konten website, produk, harga jual, dan perhitungan HPP.</p><div class="toolbar"><button class="btn" onclick="go('products')">Kelola Produk</button><button class="btn light" onclick="go('testimonials')">Kelola Testimoni</button><button class="btn light" onclick="go('hpp')">Hitung HPP</button></div></div><div class="panel"><h3>Catatan prototype</h3><p class="muted">Perubahan tersimpan di penyimpanan browser (localStorage). Data belum terhubung ke server atau database online.</p></div>`}
function go(p){page=p;$$('#nav button').forEach(x=>x.classList.toggle('active',x.dataset.page===p));render()}
function testimonials(){let action=`<button class="btn" onclick="$('#photoInput').click()">＋ Tambah Testimoni</button>`;$('#view').innerHTML=head('Kelola Testimoni','Unggah foto testimoni pelanggan untuk ditampilkan pada website.',action)+`<div class="panel"><div class="upload"><div style="font-size:34px">▧</div><h3>Unggah Foto Testimoni</h3><p class="muted">Pilih satu atau beberapa foto dari perangkat. Format JPG, PNG, WEBP.</p><input id="photoInput" type="file" accept="image/png,image/jpeg,image/webp" multiple onchange="uploadPhotos(this.files)"></div></div><div class="panel"><div class="panel-head"><h3>Daftar Testimoni (${db.testimonials.length})</h3><select id="sortPhotos" style="width:auto" onchange="sortPhotos(this.value)"><option value="new">Terbaru</option><option value="old">Terlama</option></select></div><div id="photoGallery" class="grid gallery">${photoCards()}</div></div>`}
function photoCards(){if(!db.testimonials.length)return `<div class="empty" style="grid-column:1/-1">Belum ada foto testimoni. Unggah foto pertama untuk mulai mengisi galeri.</div>`;return db.testimonials.map(t=>`<div class="photo-card"><img src="${t.data}" alt="Foto testimoni"><div class="photo-actions"><small class="muted">${new Date(t.date).toLocaleDateString('id-ID')}</small><div class="actions"><button class="btn small light" onclick="previewPhoto(${t.id})">Lihat</button><button class="btn small danger" onclick="deleteItem('testimonials',${t.id})">Hapus</button></div></div></div>`).join('')}
async function uploadPhotos(files){for(const f of files){if(!f.type.startsWith('image/'))continue;if(f.size>5*1024*1024){toast('Foto '+f.name+' melebihi 5 MB');continue}try{db.testimonials.unshift({id:id(),data:await imgSrc(f),date:new Date().toISOString(),name:f.name})}catch{toast('Gagal membaca '+f.name)}}save();testimonials();toast('Foto testimoni berhasil diunggah')}
function sortPhotos(v){db.testimonials.sort((a,b)=>v==='old'?new Date(a.date)-new Date(b.date):new Date(b.date)-new Date(a.date));$('#photoGallery').innerHTML=photoCards()}
function previewPhoto(i){const t=db.testimonials.find(x=>x.id===i);if(t)modal('Preview Testimoni',`<img src="${t.data}" style="max-width:100%;max-height:65vh;display:block;margin:auto;border-radius:10px">`, '')}
function products(){let rows=db.products.map(x=>`<tr><td>${esc(x.name)}</td><td>${esc(x.category)}</td><td>${esc(x.material)}</td><td>${esc(x.size)}</td><td>Rp ${Number(x.price||0).toLocaleString('id-ID')}</td><td><div class="actions"><button class="btn small light" onclick="editProduct(${x.id})">Edit</button><button class="btn small danger" onclick="deleteItem('products',${x.id})">Hapus</button></div></td></tr>`).join('');$('#view').innerHTML=head('Kelola Produk','Tambah, ubah, dan hapus informasi produk.',`<button class="btn" onclick="editProduct()">＋ Tambah Produk</button>`)+`<div class="panel"><div class="toolbar" style="margin-bottom:14px"><input id="productSearch" placeholder="Cari nama produk..." oninput="filterProducts()"></div><div class="table-wrap"><table><thead><tr><th>Nama Produk</th><th>Kategori</th><th>Material</th><th>Ukuran</th><th>Harga</th><th>Aksi</th></tr></thead><tbody id="productRows">${rows||'<tr><td colspan="6" class="empty">Belum ada produk.</td></tr>'}</tbody></table></div></div>`}
function filterProducts(){let q=$('#productSearch').value.toLowerCase();$$('#productRows tr').forEach(r=>r.style.display=r.innerText.toLowerCase().includes(q)?'':'none')}
function editProduct(i){let x=db.products.find(p=>p.id===i)||{name:'',category:'',material:'',size:'',motif:'',price:'',desc:''};modal(i?'Edit Produk':'Tambah Produk',`<div class="form-grid">${field('Nama Produk','name',x.name)}${field('Kategori','category',x.category)}${field('Material','material',x.material)}${field('Ukuran','size',x.size)}${field('Motif','motif',x.motif)}${field('Harga Jual (Rp)','price',x.price,'number')}<div class="field span2"><label>Deskripsi</label><textarea id="f_desc">${esc(x.desc)}</textarea></div></div>`,`<button class="btn" onclick="saveProduct(${i||0})">Simpan</button>`)}
function saveProduct(i){let x={id:i||id(),name:val('name'),category:val('category'),material:val('material'),size:val('size'),motif:val('motif'),price:Number(val('price')||0),desc:$('#f_desc').value};if(!x.name){toast('Nama produk wajib diisi');return}let n=db.products.findIndex(p=>p.id===i);if(n<0)db.products.push(x);else db.products[n]=x;save();closeModal();products();toast('Produk tersimpan')}
function field(label,key,value='',type='text'){return `<div class="field"><label>${label}</label><input id="f_${key}" type="${type}" value="${esc(value)}"></div>`}
function val(k){return $('#f_'+k)?.value||''}
function generic(key,title,desc,labels){$('#view').innerHTML=head(title,desc,`<button class="btn" onclick="editGeneric('${key}')">＋ Tambah ${title}</button>`)+`<div class="panel"><div class="table-wrap"><table><thead><tr>${labels.map(l=>`<th>${esc(l)}</th>`).join('')}<th>Aksi</th></tr></thead><tbody>${(db[key]||[]).map(x=>`<tr><td>${esc(x.name||x.title||'')}</td>${labels.slice(1).map(l=>`<td>${esc(x[l.toLowerCase()]||x.desc||x.date||x.location||'-')}</td>`).join('')}<td><div class="actions"><button class="btn small light" onclick="editGeneric('${key}',${x.id})">Edit</button><button class="btn small danger" onclick="deleteItem('${key}',${x.id})">Hapus</button></div></td></tr>`).join('')||`<tr><td colspan="${labels.length+1}" class="empty">Belum ada data.</td></tr>`}</tbody></table></div></div>`}
function editGeneric(key,i){let x=(db[key]||[]).find(a=>a.id===i)||{};let title=key==='events'?'Event':'Experience';modal(i?'Edit '+title:'Tambah '+title,`<div class="form-grid">${field('Nama', 'name',x.name||'')}${key==='events'?field('Tanggal','date',x.date||'','date')+field('Lokasi','location',x.location||''):''}<div class="field span2"><label>Deskripsi</label><textarea id="f_desc">${esc(x.desc||'')}</textarea></div></div>`,`<button class="btn" onclick="saveGeneric('${key}',${i||0})">Simpan</button>`)}
function saveGeneric(k,i){let x={id:i||id(),name:val('name'),desc:$('#f_desc').value,date:val('date'),location:val('location')};if(!x.name){toast('Nama wajib diisi');return}let n=db[k].findIndex(a=>a.id===i);if(n<0)db[k].push(x);else db[k][n]=x;save();closeModal();render();toast('Data tersimpan')}
function findus(){let rows=db.findus.map(x=>`<tr><td>${esc(x.type)}</td><td>${esc(x.name)}</td><td>${esc(x.address)}</td><td>${esc(x.url)}</td><td><button class="btn small light" onclick="editFind(${x.id})">Edit</button> <button class="btn small danger" onclick="deleteItem('findus',${x.id})">Hapus</button></td></tr>`).join('');$('#view').innerHTML=head('Find Us','Kelola lokasi fisik dan kanal penjualan online.',`<button class="btn" onclick="editFind()">＋ Tambah Lokasi</button>`)+`<div class="panel"><div class="table-wrap"><table><thead><tr><th>Jenis</th><th>Nama</th><th>Alamat</th><th>Link</th><th>Aksi</th></tr></thead><tbody>${rows||'<tr><td colspan="5" class="empty">Belum ada lokasi.</td></tr>'}</tbody></table></div></div>`}
function editFind(i){let x=db.findus.find(a=>a.id===i)||{};modal(i?'Edit Find Us':'Tambah Find Us',`<div class="field"><label>Jenis</label><select id="f_type"><option>Fisik</option><option>Online</option></select></div>${field('Nama lokasi/platform','name',x.name||'')}${field('Alamat','address',x.address||'')}${field('Link Maps / toko','url',x.url||'')}`,`<button class="btn" onclick="saveFind(${i||0})">Simpan</button>`);$('#f_type').value=x.type||'Fisik'}
function saveFind(i){let x={id:i||id(),type:val('type'),name:val('name'),address:val('address'),url:val('url')};if(!x.name){toast('Nama wajib diisi');return}let n=db.findus.findIndex(a=>a.id===i);if(n<0)db.findus.push(x);else db.findus[n]=x;save();closeModal();findus();toast('Lokasi tersimpan')}
function faq(){let rows=db.faq.map(x=>`<tr><td>${esc(x.q)}</td><td>${esc(x.a)}</td><td><button class="btn small light" onclick="editFaq(${x.id})">Edit</button> <button class="btn small danger" onclick="deleteItem('faq',${x.id})">Hapus</button></td></tr>`).join('');$('#view').innerHTML=head('FAQ','Kelola pertanyaan yang sering diajukan pelanggan.',`<button class="btn" onclick="editFaq()">＋ Tambah FAQ</button>`)+`<div class="panel"><div class="table-wrap"><table><thead><tr><th>Pertanyaan</th><th>Jawaban</th><th>Aksi</th></tr></thead><tbody>${rows||'<tr><td colspan="3" class="empty">Belum ada FAQ.</td></tr>'}</tbody></table></div></div>`}
function editFaq(i){let x=db.faq.find(a=>a.id===i)||{};modal(i?'Edit FAQ':'Tambah FAQ',`<div class="field"><label>Pertanyaan</label><input id="f_q" value="${esc(x.q||'')}"></div><div class="field"><label>Jawaban</label><textarea id="f_a">${esc(x.a||'')}</textarea></div>`,`<button class="btn" onclick="saveFaq(${i||0})">Simpan</button>`)}
function saveFaq(i){let x={id:i||id(),q:val('q'),a:$('#f_a').value};if(!x.q||!x.a){toast('Pertanyaan dan jawaban wajib diisi');return}let n=db.faq.findIndex(a=>a.id===i);if(n<0)db.faq.push(x);else db.faq[n]=x;save();closeModal();faq();toast('FAQ tersimpan')}
function about(){let a=db.about;$('#view').innerHTML=head('About Us','Kelola informasi profil Boyan Craft.')+`<div class="panel"><div class="field"><label>Judul</label><input id="aboutTitle" value="${esc(a.title)}"></div><div class="field"><label>Deskripsi</label><textarea id="aboutDescription">${esc(a.description)}</textarea></div><div class="field"><label>Our Story</label><textarea id="aboutStory">${esc(a.story)}</textarea></div><div class="field"><label>Our Problem</label><textarea id="aboutProblem">${esc(a.problem)}</textarea></div><div class="field"><label>Our Solution</label><textarea id="aboutSolution">${esc(a.solution)}</textarea></div><button class="btn" onclick="saveAbout()">Simpan Perubahan</button></div>`}
function saveAbout(){db.about={title:$('#aboutTitle').value,description:$('#aboutDescription').value,story:$('#aboutStory').value,problem:$('#aboutProblem').value,solution:$('#aboutSolution').value};save();toast('About Us berhasil diperbarui')}
function master(){let a=db.master;$('#view').innerHTML=head('Data Master','Kelola pilihan kategori, material, ukuran, dan motif produk.')+`<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(220px,1fr))">${['categories','materials','sizes','motifs'].map(k=>`<div class="panel"><h3>${k==='categories'?'Kategori':k==='materials'?'Material':k==='sizes'?'Ukuran':'Motif'}</h3><div class="field"><input id="master_${k}" placeholder="Tambah data baru"></div><button class="btn small" onclick="addMaster('${k}')">Tambah</button><ul>${a[k].map((v,i)=>`<li style="margin:9px 0">${esc(v)} <button class="btn small danger" onclick="removeMaster('${k}',${i})">×</button></li>`).join('')}</ul></div>`).join('')}</div>`}
function addMaster(k){let v=$('#master_'+k).value.trim();if(v){db.master[k].push(v);save();master()}}
function removeMaster(k,i){db.master[k].splice(i,1);save();master()}
function prices(){let opts=db.products.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('');$('#view').innerHTML=head('Harga Jual','Atur harga jual berdasarkan produk, material, dan ukuran.')+`<div class="panel"><h3>Atur Harga Produk</h3><div class="form-grid"><div class="field"><label>Produk</label><select id="priceProduct">${opts}</select></div>${field('Material','priceMaterial','Kanvas')}${field('Ukuran','priceSize','Sedang')}${field('Harga Jual (Rp)','priceValue','','number')}</div><button class="btn" onclick="savePrice()">Simpan Harga</button></div><div class="panel"><h3>Daftar Harga</h3><div class="table-wrap"><table><thead><tr><th>Produk</th><th>Material</th><th>Ukuran</th><th>Harga</th><th>Aksi</th></tr></thead><tbody>${db.prices.map((p,i)=>`<tr><td>${esc(db.products.find(x=>x.id==p.productId)?.name||'Produk dihapus')}</td><td>${esc(p.material)}</td><td>${esc(p.size)}</td><td>Rp ${Number(p.price).toLocaleString('id-ID')}</td><td><button class="btn small danger" onclick="deletePrice(${i})">Hapus</button></td></tr>`).join('')||'<tr><td colspan="5" class="empty">Belum ada harga khusus.</td></tr>'}</tbody></table></div></div>`}
function savePrice(){let productId=Number(val('priceProduct'));if(!productId){toast('Tambahkan produk terlebih dahulu');return}db.prices.push({productId,material:val('priceMaterial'),size:val('priceSize'),price:Number(val('priceValue')||0)});save();prices();toast('Harga jual tersimpan')}
function deletePrice(i){db.prices.splice(i,1);save();prices()}
function hpp(){$('#view').innerHTML=head('Kalkulator HPP','Hitung estimasi harga pokok produksi dan harga jual.')+`<div class="panel"><h3>Komponen biaya</h3><div class="form-grid">${field('Panjang bahan (meter)','length','','number')}${field('Lebar bahan (meter)','width','','number')}${field('Harga bahan per m² (Rp)','materialCost','','number')}${field('Biaya jahit (Rp)','sewing','','number')}${field('Biaya potong (Rp)','cutting','','number')}${field('Biaya tambahan (Rp)','extra','','number')}${field('Margin keuntungan (%)','margin','30','number')}</div><button class="btn" onclick="calculateHpp()">Hitung HPP & Harga Jual</button><div id="hppResult"></div><div class="notice">Ini kalkulator estimasi sederhana. Pastikan satuan dan biaya produksi disesuaikan dengan perhitungan Boyan Craft yang sebenarnya.</div></div>`}
function calculateHpp(){let area=Number(val('length'))*Number(val('width')),mat=area*Number(val('materialCost')),cost=mat+Number(val('sewing'))+Number(val('cutting'))+Number(val('extra')),margin=Number(val('margin')),sell=cost*(1+margin/100);$('#hppResult').innerHTML=`<div class="calc-result"><div>Estimasi luas bahan: <b>${area.toFixed(3)} m²</b></div><div>Total HPP: <strong>Rp ${Math.round(cost).toLocaleString('id-ID')}</strong></div><div>Estimasi harga jual: <strong>Rp ${Math.round(sell).toLocaleString('id-ID')}</strong></div><button class="btn small light" style="margin-top:10px" onclick="exportHpp(${Math.round(cost)},${Math.round(sell)})">Unduh hasil CSV</button></div>`}
function exportHpp(cost,sell){let rows=[['Komponen','Nilai'],['HPP',cost],['Harga Jual',sell]];let csv=rows.map(r=>r.join(',')).join('\\n');download(csv,'hasil-hpp-boyan-craft.csv','text/csv')}
function download(content,name,type){let a=document.createElement('a'),u=URL.createObjectURL(new Blob([content],{type}));a.href=u;a.download=name;a.click();URL.revokeObjectURL(u)}
function deleteItem(key,i){confirmAction('Hapus data','Data yang dihapus tidak dapat dikembalikan. Lanjutkan?',()=>{db[key]=db[key].filter(x=>x.id!==i);save();render();toast('Data berhasil dihapus')})}
function confirmAction(title,body,fn){modal(title,`<p>${body}</p>`,`<button class="btn outline" onclick="closeModal()">Batal</button><button class="btn danger" onclick="(${fn.toString()})();closeModal()">Ya, lanjutkan</button>`)}
function modal(title,body,foot=''){ $('#modalRoot').innerHTML=`<div class="modal-back" onclick="if(event.target===this)closeModal()"><div class="modal"><div class="modal-head"><h3>${esc(title)}</h3><button class="close" onclick="closeModal()">×</button></div>${body}<div class="modal-foot">${foot||'<button class="btn" onclick="closeModal()">Tutup</button>'}</div></div></div>`}
function closeModal(){$('#modalRoot').innerHTML=''}
</script></body></html>
